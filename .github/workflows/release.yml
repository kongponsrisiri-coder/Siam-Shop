name: Release

# SiamShop desktop till (SIAMSHOP-ELECTRON-001) — copied from restaurant-epos
# release.yml and adapted: no native modules to rebuild, client is built with
# the Electron base (`npm run build:electron-client`), and the release is
# published ONLY to the public releases repo (this code repo may be private;
# electron-updater can't read private releases without shipping a token).
#
# Triggers:
#   - git tag push (v*)        → builds both installers + publishes a Release
#   - manual workflow_dispatch → builds both installers, skips the Release job
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Fail fast if the tag and electron/package.json disagree — electron-updater
  # compares versions, a mismatch means no update (or the wrong one).
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match electron/package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./electron/package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "electron/package.json = $PKG   tag = $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match electron/package.json version $PKG — bump the version before tagging."
            exit 1
          fi
      # HOTFIX 0.1.2: v0.1.1 shipped a blank Till (render-time ReferenceError) with
      # every API test green. Build the Electron client and RENDER every staff
      # route in headless Chrome before any installer is built — a blank build
      # can never tag again.
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          npm install
          cd client && npm install
      - name: Render smoke test (headless Chrome)
        run: node scripts/test-render-smoke.mjs

  build-mac:
    needs: verify-version
    # macos-14 on purpose: macos-latest (→ 15 / Xcode 16) broke electron-builder 25 on 6 Sep 2026.
    runs-on: macos-14
    timeout-minutes: 60
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm install
      - name: Build React client for Electron (base ./, config-driven API)
        run: |
          cd client && npm install && cd ..
          npm run build:electron-client
      - name: Install Electron
        run: cd electron && npm install
      - name: Import Apple Developer ID certificate
        if: env.HAS_MAC_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password:    ${{ secrets.MAC_CERT_PASSWORD }}
      - name: Build Mac DMG + ZIP
        run: cd electron && npm run build:mac
      # HOTFIX v0.1.7 — the PACKAGED app must contain every main-process module and
      # launch. v0.1.5/v0.1.6 shipped without raster.js/printerScan.js and died on
      # start; the renderer smoke cannot see that.
      - name: Packaged-app check (asar modules + --self-test launch)
        run: |
          ASAR=$(find electron/dist-electron -type f -name app.asar -path '*SiamShop.app*' | head -1)
          echo "asar: $ASAR"; test -n "$ASAR"
          node scripts/check-asar.mjs "$ASAR"
          BIN=$(find electron/dist-electron -type f -name SiamShop -path '*Contents/MacOS/*' | head -1)
          echo "binary: $BIN"; test -n "$BIN"
          OUT=$("$BIN" --self-test 2>&1 | tee /dev/stderr) ; echo "$OUT" | grep -q "SELFTEST OK"
        env:
          CSC_LINK:                    ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD:            ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID:                    ${{ secrets.MAC_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.MAC_APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:               ${{ secrets.MAC_TEAM_ID }}
      - name: Show build output
        run: ls -la electron/dist-electron
      - name: Upload Mac installer + update manifest
        uses: actions/upload-artifact@v5
        with:
          name: mac-installer
          # .zip is what Mac auto-update actually consumes — dmg-only breaks OTA.
          path: |
            electron/dist-electron/*.dmg
            electron/dist-electron/*.zip
            electron/dist-electron/*.blockmap
            electron/dist-electron/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install root dependencies
        run: npm install
      - name: Build React client for Electron
        run: |
          cd client && npm install && cd ..
          npm run build:electron-client
      - name: Install Electron
        run: cd electron && npm install
      # Unsigned on purpose (no Windows code-signing cert yet — SmartScreen warns; see electron/README.md).
      - name: Build Windows installer
        run: cd electron && npm run build:win
      - name: Packaged-app check (asar modules + --self-test launch)
        shell: pwsh
        run: |
          node scripts/check-asar.mjs electron/dist-electron/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = & "electron\dist-electron\win-unpacked\SiamShop.exe" --self-test 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "SELFTEST OK") { Write-Error "self-test failed"; exit 1 }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show build output
        shell: cmd
        run: dir electron\dist-electron /s
      - name: Upload Windows installer + update manifest
        uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.blockmap
            electron/dist-electron/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    # Publish on a v* tag as long as Windows built — a Mac notarisation hiccup must not block the Windows release.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - run: ls -laR dist
      # 1) This (private) code repo — so the installers show up under Siam-Shop →
      #    Releases for humans (Korakot 7 Sep: "couldn't find the files"). The
      #    updater never reads this copy.
      - name: Publish GitHub Release (code repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SiamShop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/latest-mac.yml
            dist/**/latest.yml
      # 2) Public releases repo — the updater target baked into electron/package.json build.publish.
      - name: Publish to kongponsrisiri-coder/siamshop-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: kongponsrisiri-coder/siamshop-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: SiamShop ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Recursive globs: download-artifact@v5 nests each artifact in its own
          # folder when there are several, but lays a SINGLE artifact flat in dist/
          # (v0.1.0: Mac failed → only windows-installer → 0 assets published).
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/latest-mac.yml
            dist/**/latest.yml
